name: actmind-local
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: actmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: actmind
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - actmind-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U actmind -d actmind']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  actmind-data:
